# Publishes this release to GitHub Packages as @waifucave/mochi2d, for the
# organization's own projects. Started by hand after each release, or by a
# version tag. The source stays "private" in package.json, so it can never go
# to the public npm registry by accident; only this job renames and publishes.
name: Publish to GitHub Packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@waifucave"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Name and registry for GitHub Packages
        run: |
          npm pkg set name=@waifucave/mochi2d
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg set repository.type=git repository.url=git+https://github.com/Waifucave/Mochi2D.git
          npm pkg delete private
      - name: Publish, unless this version is already there
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@waifucave/mochi2d@$v" version > /dev/null 2>&1; then
            echo "@waifucave/mochi2d@$v is already published"
          else
            npm publish
          fi
