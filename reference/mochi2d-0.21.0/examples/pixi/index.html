<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi2D in a PixiJS scene</title>
    <!--
      PixiJS is the app's own (a peer dependency of mochi2d/pixi). This page
      takes the repository's dev dependency; a bundler resolves "pixi.js" for you.
    -->
    <script type="importmap">
      { "imports": { "pixi.js": "../../node_modules/pixi.js/dist/pixi.mjs" } }
    </script>
    <style>
      body {
        margin: 0;
        font:
          15px/1.4 system-ui,
          sans-serif;
        background: #f4f1ea;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px;
      }
      #stage canvas {
        display: block;
        width: 100%;
        border-radius: 8px;
      }
      #log {
        min-height: 1.4em;
        color: #444;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A model in a PixiJS scene</h1>
      <p>
        The model is a display object among Pixi's own: it sways in a container, fades with it, and
        sits behind a Pixi frame. Move the pointer over it, tap it, press the buttons.
      </p>
      <div id="stage"></div>
      <p>
        <button id="motion">Play a motion</button>
        <button id="expression">Next expression</button>
        <label>Fade <input id="alpha" type="range" min="0" max="1" step="0.05" value="1" /></label>
        <label><input id="sway" type="checkbox" checked /> Sway</label>
      </p>
      <p id="log"></p>
    </main>
    <script type="module">
      import { Application, Container, Graphics, Text } from "pixi.js";
      // Built by `npm run build:lib`. In your own project: import { MochiSprite } from "mochi2d/pixi".
      import { MochiSprite } from "../../dist/lib/pixi.js";

      const log = (text) => {
        const el = document.getElementById("log");
        if (el) el.textContent = text;
      };
      // ?model=<URL of a *.model3.json or a .zip>; by default DeepSeek-chan from
      // assets/models/DeepSeek/ (served under /models/ by npm run example:pixi).
      const url =
        new URLSearchParams(location.search).get("model") ??
        "../../models/DeepSeek/大肥鱼.model3.json";

      const app = new Application();
      await app.init({ width: 720, height: 540, background: "#fffaf0", antialias: true });
      document.getElementById("stage").append(app.canvas);

      // A Pixi scene: a floor, the model in a container, a frame in front.
      app.stage.addChild(
        new Graphics().ellipse(360, 500, 180, 26).fill({ color: 0x000000, alpha: 0.12 }),
      );
      const holder = new Container({ position: { x: 360, y: 500 } });
      app.stage.addChild(holder);

      const chan = await MochiSprite.from(url, {
        renderer: app.renderer,
        ticker: app.ticker,
      }).catch((e) => {
        log(
          `Could not load ${url}: ${e.message}. Put DeepSeek-chan in assets/models/DeepSeek/ ` +
            "(see the README), or open this page with ?model=<URL of a model>.",
        );
        throw e;
      });
      // Local units are the model's canvas pixels: fit its height to 480 pixels,
      // with its bottom center on the holder.
      const scale = 480 / chan.canvasHeight;
      chan.scale.set(scale);
      chan.pivot.set(chan.canvasWidth / 2, chan.canvasHeight);
      holder.addChild(chan);

      const frame = new Graphics().rect(8, 8, 704, 524).stroke({ width: 6, color: 0x8b5e3c });
      const label = new Text({ text: chan.model.name, style: { fontSize: 14, fill: 0x8b5e3c } });
      label.position.set(20, 16);
      app.stage.addChild(frame, label);

      const model = chan.model;
      log(`${model.name}: ${model.parameters.length} parameters. ${model.textureNotice ?? ""}`);

      // Pixi's events: a tap over hit areas, and what is under the pointer.
      chan.on("hit", (e) => {
        log(`Hit: ${e.areas.join(", ")}`);
        const group = model.motionGroups.find((g) => g.name.toLowerCase().startsWith("tap"));
        if (group) void model.startMotion(group.name);
      });
      chan.on("pointertap", (e) => {
        const mesh = chan.meshAtPoint(e.global);
        if (!chan.hitTest(e.global).length) log(`Tapped ${mesh ?? "nothing"}`);
      });
      chan.on("motionend", (e) => log(`Motion ${e.path} ended (${e.reason})`));

      // The container sways on Pixi's ticker; the model follows it.
      let t = 0;
      app.ticker.add((ticker) => {
        if (!document.getElementById("sway").checked) return;
        t += ticker.deltaMS / 1000;
        holder.rotation = 0.06 * Math.sin(t * 1.3);
      });
      document.getElementById("alpha").oninput = (e) => (holder.alpha = Number(e.target.value));

      document.getElementById("motion").onclick = async () => {
        const group = model.motionGroups.find((g) => g.name !== "Idle") ?? model.motionGroups[0];
        const ok = group
          ? await model.startMotion(group.name)
          : await model.startMotionFile("Animation/脱捕.motion3.json");
        log(ok ? `Playing ${model.motions.join(", ")}` : "A motion of higher priority is playing");
      };
      const names = model.expressions.length
        ? model.expressions
        : ["Exp3/脸红.exp3.json", "Exp3/爱心眼.exp3.json", "Exp3/流泪.exp3.json"];
      let next = 0;
      document.getElementById("expression").onclick = async () => {
        const name = names[next++ % names.length];
        await model.setExpression(name, { fadeIn: 0.3 });
        log(`Expression ${name}`);
      };
      // For the tests (test/pixi-browser.test.ts).
      window.mochi2dExample = { app, chan, holder };
    </script>
  </body>
</html>
