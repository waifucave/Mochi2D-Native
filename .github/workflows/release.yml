# Release packages: the C API's libraries for Linux (x86-64, arm64), macOS
# (universal: arm64 and x86-64) and Windows (x64), each with mochi2d.h, a
# CMake package config, LICENSE and THIRD_PARTY_NOTICES.md
# (tests/package/package.sh). Each package is first found and used by a
# consumer project that runs one model, shared and static. The Platforms
# workflow (macOS and Windows, Metal and Direct3D 11) runs as part of this
# one, and the release is published only when the packages and Platforms
# have passed: no release with a red check on its commit.
#
# Two ways to make a release, sharing every step (tests/package/publish.sh):
# - a run by hand on main with `release` checked (Actions › Release › Run
#   workflow): the release is created with its tag v<version>, at the
#   commit the run was started on;
# - a version tag v<version> pushed by hand: the release uses that tag.
# A run by hand without `release` builds and checks everything, runs a dry
# run of the last step, and makes nothing. The gate (the first job, and
# again right before the release is made) stops a release run before
# anything is built when the version's tag or release exists, when the run
# is not on main or not the tag of the version, or when CHANGELOG.md has no
# section for it. Only people with write access can run a workflow by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create the release and its tag v<version> at this commit (main only)"
        type: boolean
        default: false

permissions:
  contents: read

# One release run at a time; a second waits instead of racing the first to the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Before anything is built: is this a release run, and may it make the release?
  gate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: The gate
        run: tests/package/publish.sh gate

  package:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-universal
            # Quoted: the list's semicolon would end the shell command. macOS 13.3: std::to_chars of double.
            cmake: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3'
          - os: windows-2022
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The Vulkan headers (the Vulkan backend; the library links no loader)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libvulkan-dev
      - name: Build, install, use and archive the package
        shell: bash
        run: tests/package/package.sh ${{ matrix.name }} ${{ matrix.cmake }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: mochi2d-native-*
          retention-days: 14

  platforms:
    needs: gate
    uses: ./.github/workflows/platforms.yml
    permissions:
      contents: read

  # The last step, in two modes of one script (tests/package/publish.sh), so
  # that a run by hand exercises all of it but the release itself: only the
  # package artifacts (not Platforms' renders and judge), exactly the four
  # files, the notes, and what would be created.
  dry-run:
    needs: [package, platforms]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Everything the tag's run does, up to creating the release
        run: tests/package/publish.sh dry-run packages

  # A tag pushed by hand, or a run by hand with `release` checked.
  publish:
    needs: [package, platforms]
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-24.04
    # Only this job writes: it creates the release (and, from a run by hand, its tag).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: The gate again, then the release (a draft with the four files, checked, then published with its tag)
        run: tests/package/publish.sh publish packages
