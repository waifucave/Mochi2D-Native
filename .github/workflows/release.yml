# Release packages: on version tags, the C API's libraries for
# Linux (x86-64, arm64), macOS (universal: arm64 and x86-64) and Windows
# (x64), each with mochi2d.h, a CMake package config, LICENSE and
# THIRD_PARTY_NOTICES.md (tests/package/package.sh). Each package is first
# found and used by a consumer project that runs one model, shared and
# static. The Platforms workflow (macOS and Windows, Metal and Direct3D 11)
# runs as part of this one, and the release is published only when the
# packages and Platforms have passed: no release with a red check on its
# commit. The last step is tests/package/publish.sh: on a tag it creates the
# release (a draft with exactly the four packages, checked, then published);
# by hand (workflow_dispatch) the same script runs as a dry run, with every
# check and the notes, and prints what a tag would create. A tag differs from
# a run by hand only in that call.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: macos-universal
            # Quoted: the list's semicolon would end the shell command. macOS 13.3: std::to_chars of double.
            cmake: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3'
          - os: windows-2022
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The Vulkan headers (the Vulkan backend; the library links no loader)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libvulkan-dev
      - name: Build, install, use and archive the package
        shell: bash
        run: tests/package/package.sh ${{ matrix.name }} ${{ matrix.cmake }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: mochi2d-native-*
          retention-days: 14

  platforms:
    uses: ./.github/workflows/platforms.yml
    permissions:
      contents: read

  # The last step, in two modes of one script (tests/package/publish.sh), so
  # that a run by hand exercises all of it but the release itself: only the
  # package artifacts (not Platforms' renders and judge), exactly the four
  # files, the notes, and what would be created.
  dry-run:
    needs: [package, platforms]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Everything the tag's run does, up to creating the release
        run: tests/package/publish.sh dry-run packages

  publish:
    needs: [package, platforms]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # Only this job writes: it creates the release with the packages.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: The checks, then the release (a draft with the four files, checked, then published)
        run: tests/package/publish.sh publish packages
